# Serves the Vite build output as static files.
#
# App.tsx switches between its 14+ pages via client-side view state, not a
# router with real URL paths — so there's no deep-linkable route today that
# actually needs the `try_files ... /index.html` fallback below. It's kept
# anyway as a cheap safety net (a hard refresh should still load the app
# rather than 404) and because it's the standard, low-risk default for any
# single-page app served this way.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # sql.js's two .wasm files (public/sql-wasm.wasm, public/sql-wasm-browser.wasm
    # — see src/utils/gpkg.ts's comment for why both exist) are served from
    # here like any other static asset; nginx's default mime.types already
    # maps .wasm to application/wasm, so no extra config is needed for them.
    location / {
        try_files $uri /index.html;
    }
}
