[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox"
version = "1.0.0"
description = "An application to carry out automated processing of job duties"
readme = "README.md"
# toolbox/utils/workspace.py and toolbox/models/db/models.py both use PEP 695
# `type X = ...` alias statements, which only exist from Python 3.12 onward —
# confirmed by actually running the code on 3.11 (SyntaxError) vs. 3.13
# (fine). The floor here previously said 3.11, which doesn't reflect that.
requires-python = ">=3.12, <3.15"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "fuzzywuzzy>=0.18.0",
    "geoalchemy2>=0.18.4",
    "geopandas>=1.1.3",
    "geopy>=2.4.1",
    "ipykernel>=7.3.0",
    "kaleido>=1.2.0",
    "levenshtein>=0.27.3",
    "lxml>=6.1.0",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "osmnx>=2.1.0",
    "pandas>=2.3.3",
    "pandas-stubs~=3.0.1",
    "plotly>=6.6.0",
    "psycopg2>=2.9.11",
    "pyarrow",
    "pydantic>=2.12.5",
    "pypdf2>=3.0.1",
    "pyproj>=3.7.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "rapidfuzz>=3.14.3",
    "reportlab>=4.4.10",
    "scipy>=1.15.3",
    "scipy-stubs~=1.17.1",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.48",
    "tqdm>=4.67.3",
    "uvicorn>=0.41.0",
]

keywords = ['eha', 'automation', 'validation', 'toolbox', 'tracking', 'standardization', 'tracks']
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python"
]

authors = [
    {name = "Enyinnaya Richard Nwaiwu", email = "enyinnaya.nwaiwu@ehealthnigeria.org"},
    {name = "Muhammad Abubakar Mbawaya", email = "muhammad.mbawaya@ehealthnigeria.org"}
]

[dependency-groups]
dev = [
    "pyngrok>=8.1.2",
]

[tool.setuptools.package-data]
# toolbox/utils/workspace.py resolves config.yaml/planfeld_config.yaml/
# members.json by a path computed from `__file__`, not via
# importlib.resources — that only finds the real files when this package is
# installed editable (`uv sync`, `pip install -e .`), which is how local/dev
# installs and this project's Dockerfile both work today. Declaring them
# here means a plain `pip install .` / built wheel carries them too, so the
# app doesn't silently lose its config the moment someone installs it a
# different way.
"toolbox.configs" = ["*.yaml", "*.json"]
